name: Renovate

on:
  schedule:
    - cron: "0 3 * * *"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Renovate configuration
        run: RENOVATE_CONFIG_FILE=.github/renovate.json npx --yes --package renovate@44.139.0 -- renovate-config-validator

  renovate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: renovate
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
