apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: buildkitd-ca
  namespace: buildkitd
spec:
  isCA: true
  commonName: buildkitd-ca
  secretName: buildkitd-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: buildkitd-ca-selfsigned
    kind: Issuer
