apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: buildkitd-ca-trust
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
    - secret:
        name: buildkitd-ca
        key: tls.crt
  target:
    configMap:
      key: ca.crt
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - gitlab-runner
            - gitlab-runner-act
