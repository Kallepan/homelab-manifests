apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-gateway
spec:
  listeners:
    - name: http
      protocol: HTTP
      hostname: "*.svc.home.arpa"
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: "argocd.svc.home.arpa"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: argocd-tls
    - name: https-keycloak
      protocol: HTTPS
      port: 443
      hostname: "sso.svc.home.arpa"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: keycloak-tls
    - name: https-homepage
