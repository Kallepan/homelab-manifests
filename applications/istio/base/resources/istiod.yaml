apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: istiod
    repoURL: https://istio-release.storage.googleapis.com/charts
    targetRevision: 1.*.*
    helm:
      releaseName: istio
      valuesObject:
        env:
          PILOT_ENABLE_ALPHA_GATEWAY_API: "true"
        profile: ambient
        meshID: "replace-me"
        meshConfig:
          extensionProviders:
            - name: "oauth2-proxy"
              envoyExtAuthzHttp:
                service: "oauth2-proxy.oauth2-proxy.svc.cluster.local"
                port: 80
                pathPrefix: "/oauth2/auth"
                includeRequestHeadersInCheck: ["cookie", "authorization"]
                includeAdditionalHeadersInCheck:
                  X-Auth-Request-Redirect: "https://%REQ(:authority)%%REQ(:path)%"
                headersToDownstreamOnDeny: ["content-type", "set-cookie", "location", "www-authenticate"]
                headersToDownstreamOnAllow: ["set-cookie"]
                headersToUpstreamOnAllow:
                  - "authorization"
                  - "path"
                  - "x-auth-request-user"
                  - "x-auth-request-email"
                  - "x-auth-request-preferred-username"
                  - "x-auth-request-groups"
                  - "x-auth-request-access-token"
                  - "x-forwarded-access-token"
            - name: "jaeger"
              opentelemetry:
                service: "jaeger-collector.observability.svc.cluster.local"
                port: 4317
          enableTracing: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istio-validator-istio-system
      jsonPointers:
        - /webhooks/0/failurePolicy
