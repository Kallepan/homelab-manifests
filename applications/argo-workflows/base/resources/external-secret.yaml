apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-s3-credentials
  namespace: argo-workflows
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argo-workflows-s3-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        accessKey: "{{ .s3_access_key }}"
        secretKey: "{{ .s3_secret_key }}"
  data:
    - secretKey: s3_access_key
      remoteRef:
        key: services/argo-workflows
        property: ARGO_WORKFLOWS_S3_ACCESS_KEY
    - secretKey: s3_secret_key
      remoteRef:
        key: services/argo-workflows
        property: ARGO_WORKFLOWS_S3_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argo-workflows-oauth-credentials
  namespace: argo-workflows
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: argo-workflows-oauth-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-id: "{{ .client_id }}"
        client-secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: services/argo-workflows
        property: ARGO_WORKFLOWS_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: services/argo-workflows
        property: ARGO_WORKFLOWS_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-credentials
  namespace: argo-workflows
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgres-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .ACCESS_SECRET_KEY }}"
        ca.crt: "{{ .ca_crt }}"
        REGION: "eu-west-1"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: services/postgres
        property: PG_BACKUPS_ACCESS_KEY
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: services/postgres
        property: PG_BACKUPS_SECRET_ACCESS_KEY
    - secretKey: ca_crt
      remoteRef:
        key: certificates/cert-manager-ca
        property: tls.crt
