apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-github
  namespace: renovate-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 2 * * *"
  image: ghcr.io/renovatebot/renovate:latest
  parallelism: 3
  secretRef: renovate-github-credentials
  access:
    adminGroups:
      - renovate-admins
    readerGroups:
      - renovate-readers
  provider:
    name: github
  discoveryFilters:
    - "Kallepan/homelab-manifests"
  extraEnv:
    - name: GITHUB_COM_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-github-credentials
          key: GITHUB_COM_TOKEN
