apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-credentials
  namespace: renovate-operator
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: renovate-github-credentials
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_COM_USER
      remoteRef:
        key: services/renovate
        property: RENOVATE_GITHUB_USERNAME
    - secretKey: GITHUB_COM_TOKEN
      remoteRef:
        key: services/renovate
        property: RENOVATE_GITHUB_TOKEN
    - secretKey: RENOVATE_TOKEN
      remoteRef:
        key: services/renovate
        property: RENOVATE_GITHUB_TOKEN
