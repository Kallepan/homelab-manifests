apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-credentials
  namespace: renovate-operator
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: renovate-credentials
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: services/renovate
        property: RENOVATE_OAUTH_CLIENT_ID
    - secretKey: client-secret
      remoteRef:
        key: services/renovate
        property: RENOVATE_OAUTH_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-ca
  namespace: renovate-operator
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: homelab-ca
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca.crt: "{{ .ca_crt }}"
        homelab-ca.crt: "{{ .ca_crt }}"
  data:
    - secretKey: ca_crt
      remoteRef:
        key: certificates/cert-manager-ca
        property: tls.crt
---
