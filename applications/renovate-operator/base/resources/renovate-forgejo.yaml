apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-forgejo
  namespace: renovate-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 2 * * *"
  image: ghcr.io/renovatebot/renovate:latest
  parallelism: 3
  secretRef: renovate-forgejo-credentials
  access:
    adminGroups:
      - renovate-admins
    readerGroups:
      - renovate-readers
  provider:
    name: forgejo
    endpoint: https://git.infra.home.arpa/api/v1
  extraVolumes:
    - name: homelab-ca
      secret:
        secretName: homelab-ca
        items:
          - key: homelab-ca.crt
            path: homelab-ca.crt
  extraVolumeMounts:
    - name: homelab-ca
      mountPath: /etc/ssl/certs/homelab-ca.crt
      subPath: homelab-ca.crt
      readOnly: true
  extraEnv:
    - name: GITHUB_COM_TOKEN
      valueFrom:
        secretKeyRef:
          name: renovate-forgejo-credentials
          key: GITHUB_COM_TOKEN
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/ssl/certs/homelab-ca.crt
    - name: GIT_CONFIG_COUNT
      value: "1"
    - name: GIT_CONFIG_KEY_0
      value: http.https://git.infra.home.arpa/.sslCAInfo
    - name: GIT_CONFIG_VALUE_0
      value: /etc/ssl/certs/homelab-ca.crt
