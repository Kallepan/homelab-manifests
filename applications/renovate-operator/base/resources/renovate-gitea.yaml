apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: renovate-gitea
  namespace: renovate-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  schedule: "0 2 * * *"
  image: ghcr.io/renovatebot/renovate:44.161.1
  parallelism: 1
  secretRef: renovate-gitea-credentials
  provider:
    name: gitea
    endpoint: https://git.infra.home.arpa/api/v1
  extraVolumes:
    - name: homelab-ca
      secret:
        secretName: homelab-ca
        items:
          - key: homelab-ca.crt
            path: homelab-ca.crt
  extraVolumeMounts:
    - name: homelab-ca
      mountPath: /etc/ssl/certs/homelab-ca.crt
      subPath: homelab-ca.crt
      readOnly: true
  extraEnv:
    - name: NODE_EXTRA_CA_CERTS
      value: /etc/ssl/certs/homelab-ca.crt
    - name: GIT_CONFIG_COUNT
      value: "1"
    - name: GIT_CONFIG_KEY_0
      value: http.https://git.infra.home.arpa/.sslCAInfo
    - name: GIT_CONFIG_VALUE_0
      value: /etc/ssl/certs/homelab-ca.crt
