apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: renovate-operator
    repoURL: https://helm.mogenius.com/public
    targetRevision: 6.*.*
    helm:
      releaseName: renovate-operator
      valuesObject:
        fullnameOverride: renovate-operator
        auth:
          oidc:
            enabled: true
            issuerUrl: https://sso.svc.home.arpa/realms/homelab
            clientId: renovate
            existingSecret: renovate-credentials
            secretKey: client-secret
            redirectUrl: https://renovate.svc.home.arpa/auth/callback
            additionalScopes:
              - groups
            fetchUserInfoGroups: true
            caCert:
              existingSecret: homelab-ca
              key: homelab-ca.crt
        authorization:
          defaults:
            adminGroups:
              - renovate-admins
            readerGroups:
              - renovate-readers
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: renovate-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
