apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: gitlab-runner
    repoURL: https://charts.gitlab.io
    targetRevision: 0.*.*
    helm:
      releaseName: gitlab-runner
      valuesObject:
        service:
          enabled: true
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
        gitlabUrl: https://gitlab.svc.home.arpa
        certsSecretName: homelab-ca
        rbac:
          create: true
        runners:
          cache:
            secretName: gitlab-runner-s3-access
          secret: gitlab-runner-token-secret
          config: |-
            [[runners]]
              limit = 3
              request_concurrency = 2
              name = "kubernetes-runner"
              pre_get_sources_script = """
              # 1. Debian / Ubuntu / Alpine
              if command -v update-ca-certificates > /dev/null 2>&1; then
                update-ca-certificates --fresh > /dev/null 2>&1
              # 2. RHEL / CentOS / Fedora
              elif command -v update-ca-trust > /dev/null 2>&1; then
                update-ca-trust extract > /dev/null 2>&1
              else
                for bundle in /usr/local/share/ca-certificates/*.crt; do
                  if [ -f "$bundle" ]; then
                    cat "$bundle" >> /etc/ssl/certs/ca-certificates.crt 2>/dev/null || true
                  fi
                done
              fi
              """

              [runners.kubernetes]
                image = "alpine:latest"                
                allowed_pull_policies = ["always", "if-not-present"]
                pull_policy = "if-not-present"

                cpu_request = "500m"
                cpu_limit = "2"
                memory_request = "1Gi"
                memory_limit = "4Gi"

                environment = [
                  "GIT_SSL_CAINFO=/usr/local/share/ca-certificates/ca.crt",
                  "SSL_CERT_FILE=/usr/local/share/ca-certificates/ca.crt",
                  "REQUESTS_CA_BUNDLE=/usr/local/share/ca-certificates/ca.crt",
                  "NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/ca.crt"
                  "TF_HTTP_CLIENT_CA_CERTIFICATE_PEM=/usr/local/share/ca-certificates/ca.crt"
                ]

              [[runners.kubernetes.volumes.secret]]
                name = "homelab-ca"
                mount_path = "/usr/local/share/ca-certificates"
                read_only = true

              [runners.cache]
                Type = "s3"
                Shared = true
                Path = "runner"
                [runners.cache.s3]
                  ServerAddress = "s3.storage.home.arpa"
                  BucketName = "gitlab-runner"
                  BucketLocation = "eu-west-1"
                  AuthenticationType = "access-key"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
