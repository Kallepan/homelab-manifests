apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaContactPoint
metadata:
  name: mattermost
  namespace: observability
spec:
  name: mattermost
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  receivers:
    - type: slack
      settings:
        title: Grafana Alert
      valuesFrom:
        - targetPath: url
          valueFrom:
            secretKeyRef:
              name: alertmanager-mattermost-webhook-url
              key: mattermost-webhook-url
