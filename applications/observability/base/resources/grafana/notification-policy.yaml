apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaNotificationPolicy
metadata:
  name: mattermost
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  route:
    receiver: mattermost
    group_by:
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
