apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-jaeger
  namespace: observability
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-jaeger
  hostnames:
    - jaeger.svc.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jaeger-collector
          port: 16686
