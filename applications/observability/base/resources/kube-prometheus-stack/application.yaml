apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: "92.*"
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        kubeEtcd:
          enabled: true
          service:
            selector:
              k8s-app: kube-controller-manager # Fix selector for kube-etcd for Talos (set itentionally to kube-controller-manager because all master nodes has the same roles)
        kube-state-metrics:
          metricLabelsAllowlist:
            - nodes=[*]
            - namespaces=[*]
            - configmaps=[*]
        alertmanager:
          alertmanagerSpec:
            externalUrl: https://alerts.svc.home.arpa
            secrets:
              - alertmanager-mattermost-webhook-url
              - homelab-ca
          config:
            global:
              resolve_timeout: 5m
              http_config:
                tls_config:
                  ca_file: /etc/alertmanager/secrets/homelab-ca/homelab-ca.crt
            inhibit_rules:
              - source_matchers:
                  - "severity = critical"
                target_matchers:
                  - "severity =~ warning|info"
                equal:
                  - "namespace"
              - source_matchers:
                  - "severity = warning"
                target_matchers:
                  - "severity = info"
                equal:
                  - "namespace"
              - source_matchers:
                  - "alertname = InfoInhibitor"
                target_matchers:
                  - "severity = info"
                equal:
                  - "namespace"
              - target_matchers:
                  - "alertname = InfoInhibitor"
            route:
              group_by: ["namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              receiver: "mattermost-metrics-receiver"
              routes:
                - receiver: "null"
                  matchers:
                    - alertname = "Watchdog"
                  continue: false
                - receiver: "mattermost-logging-receiver"
                  matchers:
                    - source = "loki"
                  continue: false
                - receiver: "mattermost-metrics-receiver"
                  matchers:
                    - source = "prometheus"
                    - severity =~ "critical|warning"
                  continue: false
            receivers:
              - name: "mattermost-logging-receiver"
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-mattermost-webhook-url/mattermost-webhook-url
                    send_resolved: true
              - name: "mattermost-metrics-receiver"
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-mattermost-webhook-url/mattermost-webhook-url
                    send_resolved: true
              - name: "null"
            templates:
              - "/etc/alertmanager/config/*.tmpl"
          ingress:
            enabled: false
        additionalPrometheusRulesMap:
          endpoint-alerts:
            groups:
              - name: ruleset_1
                rules:
                  - alert: EndpointDown
                    expr: probe_success == 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Endpoint {{ $labels.instance }} is down"
                      description: "{{ $labels.instance }} of probe {{ $labels.job }} has been down for more than 1 minute."
        crds:
          upgradeJob:
            enabled: false
        defaultRules:
          create: true
          rules:
            kubeProxy: false # Disabled due to cilium
        defaultDashboardsEnabled: true
        grafana:
          enabled: true
          persistence:
            enabled: true
            type: pvc
            storageClassName: ceph-block
            accessModes:
              - ReadWriteOnce
            size: 1Gi
          service:
            port: 3000
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: observability
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: grafana-oauth-credentials
                key: client_id
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oauth-credentials
                key: client_secret
            GF_ALERTING_MATTERMOST_WEBHOOK_URL:
              secretKeyRef:
                name: alertmanager-mattermost-webhook-url
                key: mattermost-webhook-url
          extraSecretMounts:
            - name: homelab-ca
              secretName: homelab-ca
              mountPath: /etc/ssl/certs/homelab-ca.crt
              subPath: homelab-ca.crt
              readOnly: true
          grafana.ini:
            server:
              root_url: https://grafana.svc.home.arpa
            auth:
              disable_login_form: false
            auth.basic:
              enabled: true
            auth.anonymous:
              enabled: true
            auth.generic_oauth:
              enabled: true
              name: Keycloak-OAuth
              allow_sign_up: true
              allow_assign_grafana_admin: true
              auto_login: false
              tls_skip_verify_insecure: true
              client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid email profile offline_access roles
              email_attribute_path: email
              login_attribute_path: preferred_username
              name_attribute_path: name
              role_attribute_path: contains(resource_access.grafana.roles[*], 'admin') && 'Admin' || contains(resource_access.grafana.roles[*], 'editor') && 'Editor' || 'Viewer'
              auth_url: https://sso.svc.home.arpa/realms/homelab/protocol/openid-connect/auth
              token_url: https://sso.svc.home.arpa/realms/homelab/protocol/openid-connect/token
              api_url: https://sso.svc.home.arpa/realms/homelab/protocol/openid-connect/userinfo
              skip_org_role_sync: false
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-query-frontend.observability.svc.cluster.local:3100
              isDefault: false
              editable: true
              uid: loki
            - name: Jaeger
              type: jaeger
              access: proxy
              url: http://jaeger-collector.observability.svc.cluster.local:16686
              isDefault: false
              editable: true
              uid: jaeger
          alerting:
            contactpoints.yaml:
              apiVersion: 1
              contactPoints:
                - orgId: 1
                  name: mattermost
                  receivers:
                    - uid: mattermost
                      type: slack
                      settings:
                        title: Grafana Alert
                        url: $__env{GF_ALERTING_MATTERMOST_WEBHOOK_URL}
            policies.yaml:
              apiVersion: 1
              policies:
                - orgId: 1
                  receiver: mattermost
                  group_by:
                    - alertname
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 12h
        prometheus:
          prometheusSpec:
            additionalArgs:
              - name: "web.enable-otlp-receiver"
                value: ""
              - name: "web.enable-remote-write-receiver"
                value: ""
            additionalScrapeConfigs:
              - job_name: docker-host
                metrics_path: /metrics
                scheme: https
                static_configs:
                  - targets:
                      - alloy.infra.home.arpa
                tls_config:
                  ca_file: /etc/prometheus/secrets/homelab-ca/homelab-ca.crt
              - job_name: gitlab
                metrics_path: /-/metrics
                scheme: https
                static_configs:
                  - targets:
                      - gitlab.svc.home.arpa
                tls_config:
                  ca_file: /etc/prometheus/secrets/homelab-ca/homelab-ca.crt
              - job_name: blackbox_http
                metrics_path: /probe
                params:
                  module: [http_2xx]
                static_configs:
                  - targets:
                      # Network Health
                      - https://google.com
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.observability.svc.cluster.local:9115
              - job_name: blackbox_http_homelab
                metrics_path: /probe
                params:
                  module: [http_2xx_homelab]
                static_configs:
                  - targets:
                      # Core Cluster
                      - https://gitlab.svc.home.arpa/-/liveness?token=HP9GkY_ebzpBLi3UaNCL
                      - https://bao.infra.home.arpa
                      - https://sso.svc.home.arpa
                      - https://mattermost.svc.home.arpa
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.observability.svc.cluster.local:9115
              - job_name: blackbox_http_auth
                metrics_path: /probe
                params:
                  module: [http_auth]
                static_configs:
                  - targets:
                      # Docker Machine
                      - https://traefik.infra.home.arpa/dashboard/#
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: prometheus-blackbox-exporter.observability.svc.cluster.local:9115
              - job_name: istiod
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names:
                        - istio-system
                relabel_configs:
                  - source_labels:
                      [
                        __meta_kubernetes_service_name,
                        __meta_kubernetes_endpoint_port_name,
                      ]
                    action: keep
                    regex: istiod;http-monitoring
              - job_name: rook-ceph-mgr
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names:
                        - rook-ceph
                relabel_configs:
                  - source_labels:
                      [
                        __meta_kubernetes_service_name,
                        __meta_kubernetes_endpoint_port_name,
                      ]
                    action: keep
                    regex: rook-ceph-mgr;http-metrics
              - job_name: "envoy-stats"
                metrics_path: /stats/prometheus
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_container_port_name]
                    action: keep
                    regex: ".*-envoy-prom"
            scrapeClasses:
              - default: true
                name: cluster-label
                relabelings:
                  - sourceLabels: [__name__]
                    regex: (.*)
                    targetLabel: k8s_cluster
                    replacement: service
                    action: replace
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 30Gi
                  storageClassName: ceph-block
            secrets:
              - homelab-ca
            scrapeInterval: 30s
            evaluationInterval: 30s
            scrapeTimeout: 30s
            retention: 15d
            retentionSize: 20GB
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
