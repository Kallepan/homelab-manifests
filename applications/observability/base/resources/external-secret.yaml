apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-ca
  namespace: observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: homelab-ca
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca.crt: "{{ .ca_crt }}"
        homelab-ca.crt: "{{ .ca_crt }}"
  data:
    - secretKey: ca_crt
      remoteRef:
        key: certificates/cert-manager-ca
        property: tls.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth-credentials
  namespace: observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-oauth-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: "{{ .client_id }}"
        client_secret: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: services/monitoring
        property: GRAFANA_OIDC_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: services/monitoring
        property: GRAFANA_OIDC_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-secrets
  namespace: observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: loki-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        LOKI_S3_ACCESS_KEY_ID: "{{ .access_key }}"
        LOKI_S3_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key
      remoteRef:
        key: services/monitoring
        property: LOKI_S3_ACCESS_KEY
    - secretKey: secret_access_key
      remoteRef:
        key: services/monitoring
        property: LOKI_S3_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-mattermost-webhook-url
  namespace: observability
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: alertmanager-mattermost-webhook-url
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        mattermost-webhook-url: "{{ .webhook_url }}"
  data:
    - secretKey: webhook_url
      remoteRef:
        key: services/monitoring
        property: ALERTMANAGER_WEBHOOK_URL
