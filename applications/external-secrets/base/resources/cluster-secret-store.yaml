apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: https://boa.infra.home.arpa
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          # Configure this OpenBao role for the ESO service account in the
          # external-secrets-operator namespace and grant it read access to
          # the secret/data/* KV v2 path.
          role: external-secrets
