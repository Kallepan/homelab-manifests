apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-registry-credentials
  namespace: backstage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backstage-registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: >-
          {"auths":{"registry.svc.home.arpa":{"username":"image-pull-token","password":"{{ .password }}","auth":"{{ printf "image-pull-token:%s" .password | b64enc }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: services/backstage
        property: BACKSTAGE_IMAGE_PULL_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-credentials
  namespace: backstage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: postgres-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .ACCESS_SECRET_KEY }}"
        ca.crt: "{{ .ca_crt }}"
        REGION: "eu-west-1"
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: services/postgres
        property: PG_BACKUPS_ACCESS_KEY
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: services/postgres
        property: PG_BACKUPS_SECRET_ACCESS_KEY
    - secretKey: ca_crt
      remoteRef:
        key: certificates/cert-manager-ca
        property: tls.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-ca
  namespace: backstage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: homelab-ca
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca.crt: "{{ .ca_crt }}"
        homelab-ca.crt: "{{ .ca_crt }}"
        self-signed-ca.crt: "{{ .ca_crt }}"
  data:
    - secretKey: ca_crt
      remoteRef:
        key: certificates/cert-manager-ca
        property: tls.crt
---
