apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-application-credentials
  namespace: backstage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backstage-application-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTH_SESSION_SECRET: "{{ .auth_session_secret }}"
  data:
    - secretKey: auth_session_secret
      remoteRef:
        key: services/backstage
        property: BACKSTAGE_AUTH_SESSION_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-oidc-credentials
  namespace: backstage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backstage-oidc-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTH_OIDC_CLIENT_ID: "{{ .client_id }}"
        AUTH_OIDC_CLIENT_SECRET: "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: services/backstage
        property: BACKSTAGE_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: services/backstage
        property: BACKSTAGE_CLIENT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-argocd-credentials
  namespace: backstage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backstage-argocd-credentials
