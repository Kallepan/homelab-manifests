---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-registry-credentials
  namespace: backstage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: backstage-registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: >-
          {"auths":{"registry.svc.home.arpa":{"username":"image-pull-token","password":"{{ .password }}","auth":"{{ printf "image-pull-token:%s" .password | b64enc }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: services/backstage
        property: BACKSTAGE_IMAGE_PULL_TOKEN
