apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-postgresql
  namespace: backstage
spec:
  instances: 2

  storage:
    storageClass: ceph-block
    size: 10Gi

  backup:
    barmanObjectStore:
      destinationPath: s3://pg-backups/backstage-postgresql
      endpointURL: https://s3.storage.home.arpa
      s3Credentials:
        accessKeyId:
          name: postgres-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: postgres-backup-credentials
          key: ACCESS_SECRET_KEY
        region:
          name: postgres-backup-credentials
          key: REGION
      endpointCA:
        name: postgres-backup-credentials
        key: ca.crt
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "30d"

  bootstrap:
    initdb:
      database: backstage_db
      owner: backstage
      postInitApplicationSQL:
        - "GRANT ALL ON SCHEMA public TO backstage"
        - "ALTER USER backstage SUPERUSER CREATEDB"

  managed:
    roles:
      - name: backstage
        ensure: present
        login: true
        superuser: true
        createdb: true
