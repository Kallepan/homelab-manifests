apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app.kubernetes.io/name: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
    spec:
      serviceAccountName: backstage
      imagePullSecrets:
        - name: backstage-registry-credentials
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: registry.svc.home.arpa/homelab/backstage/main:latest
          imagePullPolicy: Always
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /usr/local/share/ca-certificates/self-signed-ca.crt
            - name: ARGOCD_SERVER_URL
              valueFrom:
                configMapKeyRef:
                  name: backstage-config
                  key: ARGOCD_SERVER_URL
            - name: AUTH_OIDC_METADATA_URL
              valueFrom:
                configMapKeyRef:
                  name: backstage-config
                  key: AUTH_OIDC_METADATA_URL
            - name: GITLAB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backstage-config
                  key: GITLAB_HOST
          envFrom:
            - secretRef:
                name: backstage-application-credentials
            - secretRef:
                name: backstage-database-credentials
            - secretRef:
                name: backstage-oidc-credentials
            - secretRef:
                name: backstage-argocd-credentials
            - secretRef:
                name: backstage-gitlab-credentials
          volumeMounts:
            - name: backstage-config
              mountPath: /app/app-config.yaml
              subPath: app-config.yaml
              readOnly: true
            - name: backstage-config
              mountPath: /app/config/app-config-production.yaml
              subPath: app-config-production.yaml
              readOnly: true
            - name: homelab-ca
              mountPath: /usr/local/share/ca-certificates/self-signed-ca.crt
              subPath: self-signed-ca.crt
              readOnly: true
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            httpGet:
              path: /healthcheck
              port: http
              scheme: HTTP
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            periodSeconds: 10
            successThreshold: 1
            httpGet:
              path: /healthcheck
              port: http
              scheme: HTTP
            timeoutSeconds: 1
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: backstage-config
          configMap:
            name: backstage-config
        - name: homelab-ca
          secret:
            secretName: homelab-ca
