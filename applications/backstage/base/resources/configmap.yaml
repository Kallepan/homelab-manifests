apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  ARGOCD_SERVER_URL: https://argocd.svc.home.arpa
  AUTH_OIDC_METADATA_URL: https://sso.svc.home.arpa/realms/homelab/.well-known/openid-configuration
  GITLAB_HOST: gitlab.svc.home.arpa
  app-config.yaml: |
    app:
      title: HomeLab Backstage
      baseUrl: https://backstage.svc.home.arpa

    # Enable all packages by default, this will discover packages from packages/app/package.json
      packages: all

      extensions:
        # Disable the nav items that we're manually rendering in packages/app/src/modules/nav/Sidebar.tsx
        - nav-item:search: false
        - nav-item:user-settings: false
        - nav-item:catalog: false
        - nav-item:scaffolder: false

        # Configure Homepage
        - page:home:
            config:
              path: /
              title: Home

        # Configure the catalog plugin to be available at the /catalog path with the title "Catalog"
        - page:catalog:
            config:
              path: /catalog
              title: Catalog

        # The Backstage integration for the Tech Radar based on Zalando's Tech Radar open sourced on GitHub.
        - page:tech-radar:
            config:
              path: /tech-radar
              title: Tech Radar

    techRadar:
      url: https://gitlab.svc.home.arpa/homelab/techradar/-/blob/main/techradar.json


    organization:
      name: HomeLab

    backend:
      baseUrl: https://backstage.svc.home.arpa
      listen: ':7007'
      csp:
        connect-src: ["'self'", 'http:', 'https:']
      cors:
        origin: https://backstage.svc.home.arpa
      database:
        client: pg
        connection:
          host: ${POSTGRES_HOST}
          port: ${POSTGRES_PORT}
          user: ${POSTGRES_USER}
          password: ${POSTGRES_PASSWORD}
          database: ${POSTGRES_DB}
      # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
      actions:
        pluginSources:
          - auth
          - catalog
          - scaffolder

    integrations:
      # GitLab integration configuration
      # See https://backstage.io/docs/integrations/gitlab/locations
      gitlab:
        - host: ${GITLAB_HOST}
          apiBaseUrl: https://${GITLAB_HOST}/api/v4
          token: ${GITLAB_TOKEN}

    argocd:
      baseUrl: ${ARGOCD_SERVER_URL}
      appLocatorMethods:
        - type: config
          instances:
            - name: default
              url: ${ARGOCD_SERVER_URL}
              token: ${ARGOCD_AUTH_TOKEN}

    proxy:
      endpoints:
        '/argocd/api':
          target: '${ARGOCD_SERVER_URL}/api/v1/'
          changeOrigin: true
          secure: true
          headers:
            Cookie: ${ARGOCD_AUTH_TOKEN}

    # Reference documentation http://backstage.io/docs/features/techdocs/configuration
    # Note: After experimenting with basic setup, use CI/CD to generate docs
    # and an external cloud storage when deploying TechDocs for production use-case.
    # https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
    techdocs:
      builder: 'local' # Alternatives - 'external'
      generator:
        runIn: 'local' # Alternatives - 'local'
      publisher:
        type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

    auth:
      session:
        secret: ${AUTH_SESSION_SECRET}
      environment: production

      providers:
        oidc:
          production:
            clientId: ${AUTH_OIDC_CLIENT_ID}
            clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
            metadataUrl: ${AUTH_OIDC_METADATA_URL}
            prompt: auto
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail

    scaffolder:
      # see https://backstage.io/docs/features/software-templates/configuration for software template options

    catalog:
      locations:
        - type: file
          target: ./catalog-info.yaml
        - type: url
          target: https://gitlab.svc.home.arpa/homelab/backstage-catalog/-/blob/main/catalog/homelab.yaml
        - type: url
          target: https://gitlab.svc.home.arpa/homelab/backstage-catalog/-/blob/main/catalog/argocd.yaml
        - type: url
          target: https://gitlab.svc.home.arpa/homelab/backstage-catalog/-/blob/main/catalog/services.yaml
        - type: url
          target: https://gitlab.svc.home.arpa/homelab/backstage-catalog/-/blob/main/catalog/organization.yaml
          rules:
            - allow: [User, Group]

    kubernetes:
      serviceLocatorMethod:
        type: singleTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: homelab
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              skipTLSVerify: false
              skipMetricsLookup: true
      objectTypes:
        - pods
        - services
        - deployments
        - replicasets
        - horizontalpodautoscalers
        - jobs
        - cronjobs
        - ingresses
        - statefulsets
        - daemonsets

    # see https://backstage.io/docs/permissions/getting-started for more on the permission framework
    permission:
      # setting this to `false` will disable permissions
      enabled: true
