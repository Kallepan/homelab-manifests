apiVersion: v1
kind: ServiceAccount
metadata:
  name: backstage-eso
  namespace: backstage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-eso-reader
  namespace: backstage
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-eso-reader-binding
  namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-eso-reader
subjects:
  - kind: ServiceAccount
    name: backstage-eso
    namespace: backstage
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: backstage-k8s-store
  namespace: backstage
spec:
  provider:
    kubernetes:
      remoteNamespace: backstage
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: backstage-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backstage-database-credentials
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: backstage-k8s-store
    kind: SecretStore
  target:
    name: backstage-database-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_HOST: "{{ .host }}"
        POSTGRES_PORT: "{{ .port }}"
        POSTGRES_USER: "{{ .user }}"
        POSTGRES_PASSWORD: "{{ .password }}"
        POSTGRES_DB: "{{ .dbname }}"
  data:
    - secretKey: user
      remoteRef:
        key: backstage-postgresql-app
        property: user
    - secretKey: password
      remoteRef:
        key: backstage-postgresql-app
        property: password
    - secretKey: host
      remoteRef:
        key: backstage-postgresql-app
        property: host
    - secretKey: port
      remoteRef:
        key: backstage-postgresql-app
        property: port
    - secretKey: dbname
      remoteRef:
        key: backstage-postgresql-app
        property: dbname
