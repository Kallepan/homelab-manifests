apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.1
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: true
        authentication:
          type: scram-sha-512
      - name: lan
        port: 9094
        type: tlsroute
        tls: true
        authentication:
          type: scram-sha-512
        configuration:
          parentRefs:
            - name: istio-gateway
              namespace: istio-system
              kind: Gateway
              group: gateway.networking.k8s.io
              sectionName: kafka
          bootstrap:
            host: kafka.svc.home.arpa
          hostTemplate: kafka-broker-{nodeId}.svc.home.arpa
          brokerCertChainAndKey:
            secretName: kafka-external-tls
            certificate: tls.crt
            key: tls.key
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
    authorization:
      type: simple
      superUsers:
        - kafka-admin
  entityOperator:
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-pool
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    class: ceph-block
    deleteClaim: false
  resources:
    requests:
      cpu: "500m"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
