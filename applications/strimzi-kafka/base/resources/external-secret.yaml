apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kafka-admin-credentials
  namespace: kafka
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: kafka-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: services/kafka
        property: KAFKA_ADMIN_PASSWORD
