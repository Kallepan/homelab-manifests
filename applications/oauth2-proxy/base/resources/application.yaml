apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Kallepan/homelab-manifests.git
    targetRevision: main
    path: applications/oauth2-proxy/charts/oauth2-proxy
    helm:
      releaseName: oauth2-proxy
      valuesObject:
        replicaCount: 2
        config:
          existingSecret: oauth2-proxy-credentials
          emailDomains:
            - "*"
          upstreams:
            - static://200
        proxyVarsAsSecrets: true
        extraArgs:
          provider: oidc
          provider-display-name: Keycloak
          oidc-issuer-url: https://sso.svc.home.arpa/realms/homelab
          redirect-url: https://oauth2-proxy.svc.home.arpa/oauth2/callback
          scope: "openid email profile"
          code-challenge-method: S256
          cookie-name: _oauth2_proxy
          cookie-domain: .svc.home.arpa
          cookie-secure: true
          cookie-samesite: lax
          cookie-refresh: 1h
          cookie-expire: 168h
          whitelist-domain: .svc.home.arpa
          email-domain: "*"
          skip-provider-button: true
          set-xauthrequest: true
          pass-access-token: true
          pass-authorization-header: true
          provider-ca-file: /etc/ssl/certs/homelab-ca.crt
          use-system-trust-store: true
        extraVolumes:
          - name: homelab-ca
            secret:
              secretName: homelab-ca
              items:
                - key: homelab-ca.crt
                  path: homelab-ca.crt
        extraVolumeMounts:
          - name: homelab-ca
            mountPath: /etc/ssl/certs/homelab-ca.crt
            subPath: homelab-ca.crt
            readOnly: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: oauth2-proxy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
