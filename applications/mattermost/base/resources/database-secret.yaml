apiVersion: v1
kind: ServiceAccount
metadata:
  name: mattermost-eso
  namespace: mattermost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mattermost-eso-reader
  namespace: mattermost
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mattermost-eso-reader-binding
  namespace: mattermost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mattermost-eso-reader
subjects:
  - kind: ServiceAccount
    name: mattermost-eso
    namespace: mattermost
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mattermost-k8s-store
  namespace: mattermost
spec:
  provider:
    kubernetes:
      remoteNamespace: mattermost
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: mattermost-eso
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mattermost-database-secret
  namespace: mattermost
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mattermost-k8s-store
    kind: SecretStore
  target:
    name: mattermost-database-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_CONNECTION_STRING: "postgres://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=disable"
        MM_SQLSETTINGS_DATASOURCE: "postgres://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=disable"
  data:
    - secretKey: user
      remoteRef:
        key: mattermost-postgresql-app
        property: user
    - secretKey: password
      remoteRef:
        key: mattermost-postgresql-app
        property: password
    - secretKey: host
      remoteRef:
        key: mattermost-postgresql-app
        property: host
    - secretKey: port
      remoteRef:
        key: mattermost-postgresql-app
        property: port
    - secretKey: dbname
      remoteRef:
        key: mattermost-postgresql-app
        property: dbname
