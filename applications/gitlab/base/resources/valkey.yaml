apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: valkey
    repoURL: https://valkey.io/valkey-helm/
    targetRevision: 1.*
    helm:
      releaseName: valkey
      valuesObject:
        auth:
          enabled: true
          usersExistingSecret: gitlab-redis-credentials
          aclUsers:
            default:
              permissions: "~* &* +@all"
              passwordKey: redis_password
        persistence:
          enabled: true
          size: 8Gi
          storageClass: ceph-block
        replica:
          enabled: true
          replicas: 1
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
