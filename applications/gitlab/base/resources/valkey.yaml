apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: valkey
    repoURL: https://valkey.io/valkey-helm/
    targetRevision: 0.*
    helm:
      releaseName: valkey
      valuesObject:
        auth:
          enabled: false
        replica:
          enabled: true
          replicas: 1
          persistence:
            size: 8Gi
            storageClass: ceph-block
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
