apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-gitlab
  namespace: gitlab
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-gitlab
  hostnames:
    - gitlab.svc.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-webservice-default
          port: 8181
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-gitlab-registry
  namespace: gitlab
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-gitlab-registry
  hostnames:
    - registry.svc.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-registry
          port: 5000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-gitlab-kas
  namespace: gitlab
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-gitlab-kas
  hostnames:
    - kas.svc.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /k8s-proxy/
      backendRefs:
        - name: gitlab-kas
          port: 8154
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-kas
          port: 8150
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-gitlab-pages
  namespace: gitlab
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-gitlab-pages
  hostnames:
    - "*.pages.svc.home.arpa"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-gitlab-pages
          port: 8090
