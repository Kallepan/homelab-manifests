        - path:
            type: PathPrefix
            value: /k8s-proxy/
      backendRefs:
        - group: ''
          kind: Service
          name: gitlab-kas
          port: 8154
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ''
          kind: Service
          name: gitlab-kas
          port: 8150
