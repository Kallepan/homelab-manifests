apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: virtual-service-vault
  namespace: vault
spec:
  hosts:
    - vault.svc.home.arpa
  gateways:
    - gateway-vault
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: vault.vault.svc.cluster.local
            port:
              number: 8200
