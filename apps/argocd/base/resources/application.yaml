apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: argocd
    repoURL: oci://ghcr.io/argoproj/argo-helm/argo-cd
    targetRevision: 9.*.*
    helm:
      releaseName: argocd
      valuesObject:
        global:
          domain: example.com
        configs:
          params:
            server.insecure: true
            application.namespaces: "*"
          cm:
            accounts:
              backstage: apiKey
            resource.customizations: |
              networking.k8s.io/Ingress:
                health.lua: |
                  hs = {}
                  hs.status = "Healthy"
                  hs.message = "Probably just fine"
                  return hs
              gateway.networking.k8s.io/HTTPRoute:
                health.lua: |
                  hs = {}
                  hs.status = "Healthy"
                  hs.message = "Probably just fine"
                  return hs
        server:
          ingress:
            enabled: true
            ingressClassName: "traefik"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
