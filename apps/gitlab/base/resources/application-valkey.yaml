apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey-gitlab
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: valkey
    repoURL: https://valkey.io/valkey-helm/
    targetRevision: "0.*"
    helm:
      valuesObject:
        dataStorage:
          enabled: true
          className: ceph-block
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gitlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
