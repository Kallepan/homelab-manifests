apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-it-tools
  namespace: it-tools
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-it-tools
  hostnames:
    - it-tools.svc.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: it-tools
          port: 80
