apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-mattermost
  namespace: mattermost
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-mattermost
  hostnames:
    - mattermost.svc.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mattermost
          port: 8065
