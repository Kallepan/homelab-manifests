apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: rook-ceph-cluster
    repoURL: https://charts.rook.io/release
    targetRevision: "1.*.*"
    helm:
      releaseName: rook-ceph-cluster
      valuesObject:
        operatorNamespace: rook-ceph
        cephClusterSpec:
          dataDirHostPath: /var/lib/rook
          mon:
            count: 3
            allowMultiplePerNode: false
          mgr:
            count: 2
            allowMultiplePerNode: false
            modules:
              - name: pg_autoscaler
                enabled: true
              - name: rook
                enabled: true
          storage:
            useAllNodes: true
            useAllDevices: false
            devices:
              - name: "sdb"
            config:
              osdsPerDevice: "1"
          resources:
            mgr:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 1Gi
            mon:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 2Gi
            osd:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                memory: 4Gi
          monitoring:
            enabled: true
          network:
            provider: host
            connections:
              requireMsgr2: true
              compression:
                enabled: true
              encryption:
                enabled: true
          # Disable the log collector, as we use Otel Collector instead
          logCollector:
            enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: rook-ceph
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  ignoreDifferences:
    - group: storage.k8s.io
      kind: StorageClass
      name: ceph-filesystem
      jsonPointers:
        - /parameters
    - group: storage.k8s.io
      kind: StorageClass
      name: ceph-block
      jsonPointers:
        - /parameters
