apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httproute-grafana
  namespace: observability
spec:
  parentRefs:
    - name: istio-gateway
      namespace: istio-system
      sectionName: https-grafana
  hostnames:
    - grafana.svc.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: grafana-service
          port: 3000
