apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: "grafana"
spec:
  config:
    server:
      root_url: https://grafana.svc.home.arpa
    auth:
      disable_login_form: "false"
    auth.basic:
      enabled: "true"
    auth.anonymous:
      enabled: "true"
    auth.generic_oauth:
      enabled: "true"
      name: Keycloak-OAuth
      allow_sign_up: "true"
      allow_assign_grafana_admin: "true"
      auto_login: "false"
      tls_skip_verify_insecure: "true"
      client_id: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid email profile offline_access roles
      email_attribute_path: email
      login_attribute_path: preferred_username
      name_attribute_path: name
      role_attribute_path: contains(resource_access.grafana.roles[*], 'admin') && 'Admin' || contains(resource_access.grafana.roles[*], 'editor') && 'Editor' || 'Viewer'
      auth_url: https://sso.svc.home.arpa/realms/homelab/protocol/openid-connect/auth
      token_url: https://sso.svc.home.arpa/realms/homelab/protocol/openid-connect/token
      api_url: https://sso.svc.home.arpa/realms/homelab/protocol/openid-connect/userinfo
      skip_org_role_sync: "false"
  deployment:
    spec:
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth-credentials
                      key: client_id
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth-credentials
                      key: client_secret
