apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: kiali
  namespace: observability
spec:
  auth:
    strategy: anonymous
  deployment:
    cluster_wide_access: true
  external_services:
    grafana:
      dashboards:
        - name: Istio Service Dashboard
          variables:
            namespace: var-namespace
            service: var-service
        - name: Istio Workload Dashboard
          variables:
            namespace: var-namespace
            workload: var-workload
        - name: Istio Mesh Dashboard
        - name: Istio Control Plane Dashboard
        - name: Istio Performance Dashboard
        - name: Istio Wasm Extension Dashboard
      enabled: true
      in_cluster_url: http://kube-prometheus-stack-grafana.observability.svc.cluster.local
      auth:
        insecure_skip_verify: true
      url: https://monitoring.infra.home.arpa
    prometheus:
      url: >-
        http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    tracing:
      enabled: true
      in_cluster_url: http://jaeger-query.observability.svc.cluster.local:16685
      use_grpc: true
  istio_namespace: istio-system