apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: harbor
    repoURL: https://helm.goharbor.io
    targetRevision: 1.*.*
    helm:
      releaseName: harbor
      valuesObject:
        expose:
          type: loadBalancer
          tls:
            enabled: false
        externalURL: https://harbor.infra.home.arpa
        persistence:
          enabled: true
          imageChartStorage:
            type: s3
            s3:
              existingSecret: harbor-secrets
              region: eu-west-1
              bucket: harbor
              skipverify: true
              regionendpoint: https://s3.storage.home.arpa
            jobservice:
              jobLog:
                storageClass: local-path
            redis:
              storageClass: local-path
            trivy:
              storageClass: local-path
        registry:
          credentials:
            username: harbor_registry_user
            existingSecret: harbor-secrets
        database:
          type: external
          external:
            host: psql.storage.home.arpa
            port: 5432
            username: harbor_user
            coreDatabase: harbor_db
            existingSecret: harbor-secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: harbor
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
