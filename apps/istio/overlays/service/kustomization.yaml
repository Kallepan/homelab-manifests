apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - path: ./gateway-listeners.patch.yaml
    target:
      group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
      name: istio-gateway
  - path: ./istiod.patch.yaml
    target:
      group: argoproj.io
      version: v1alpha1
      kind: Application
      name: istiod
