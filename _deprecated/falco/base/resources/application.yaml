apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: falco
    repoURL: https://falcosecurity.github.io/charts
    targetRevision: 9.*
    helm:
      releaseName: falco
      valuesObject:
        driver:
          kind: modern_ebpf
        tty: true

        falcosidekick:
          enabled: true
          replicaCount: 1
          webui:
            enabled: true
            replicaCount: 1
            redis:
              storageEnabled: false

        falcoctl:
          artifact:
            install:
              enabled: true
            follow:
              enabled: true
          config:
            artifact:
              install:
                refs: [falco-rules:latest, falco-incubating-rules:latest, k8saudit-rules:latest]
              follow:
                refs: [falco-rules:latest, falco-incubating-rules:latest, k8saudit-rules:latest]

        services:
          - name: k8saudit-webhook
            type: ClusterIP
            ports:
              - port: 9765
                targetPort: 9765
                protocol: TCP
                name: http

        falco:
          rules_files:
            - /etc/falco/falco_rules.yaml
            - /etc/falco/falco-incubating_rules.yaml
            - /etc/falco/k8s_audit_rules.yaml
            - /etc/falco/rules.d
          plugins:
            - name: k8saudit
              library_path: libk8saudit.so
              init_config: ""
              open_params: "http://:9765/k8s-audit"
            - name: json
              library_path: libjson.so
              init_config: ""
          load_plugins: [k8saudit, json]
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: falco
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: fluent-bit
    repoURL: https://fluent.github.io/helm-charts
    targetRevision: 0.*.*
    helm:
      releaseName: fluent-bit
      valuesObject:
        podAnnotations:
          fluentbit.io/exclude: 'true'

        daemonSetVolumes:
          - name: varlog
            hostPath:
              path: /var/log

        daemonSetVolumeMounts:
          - name: varlog
            mountPath: /var/log

        tolerations:
          - operator: Exists
            effect: NoSchedule

        nodeSelector:
          node-role.kubernetes.io/control-plane: ""

        config:
          service: |
            [SERVICE]
              Flush            5
              Daemon           Off
              Log_Level        warn
              HTTP_Server      On
              HTTP_Listen      0.0.0.0
              HTTP_Port        2020
              Health_Check     On
              Parsers_File     /fluent-bit/etc/parsers.conf
              Parsers_File     /fluent-bit/etc/conf/custom_parsers.conf

          inputs: |
            [INPUT]
              Name          tail
              Alias         audit
              Path          /var/log/audit/kube/*.log
              Parser        audit
              Tag           audit.*
              Ignore_older  true

          customParsers: |
            [PARSER]
              Name          audit
              Format        json
              Time_Key      requestReceivedTimestamp
              Time_Format   %Y-%m-%dT%H:%M:%S.%L%z

          outputs: |
            [OUTPUT]
              Name    http
              Alias   http
              Match   *
              Host    falco-k8saudit-webhook.falco.svc.cluster.local
              Port    9765
              URI     /k8s-audit
              Format  json
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
