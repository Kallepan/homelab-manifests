repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^applications/.*/charts/
      - id: end-of-file-fixer
        exclude: ^applications/.*/charts/
      # Helm template files aren't plain YAML.
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^applications/.*/charts/
      # Vendored CRDs can exceed this hook's default file-size limit.
      - id: check-added-large-files
        exclude: ^applications/.*/charts/
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        entry: devbox run -- yamllint --strict
        language: system
        types: [yaml]
        require_serial: true
        # Helm templates aren't plain YAML; this Gateway API bundle has nonstandard indentation.
        exclude: '^(applications/.*/charts/|applications/networking/base/resources/gateway-api\.yaml$)'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
